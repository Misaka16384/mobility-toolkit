[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-toolkit"
# Version is the single source of truth in mobility_toolkit/__init__.py
# (`__version__`); bump it with `python tools/release.py`.
dynamic = ["version"]
description = "Validated homological charge-module invariants for translation-invariant stabilizer codes, backed by Macaulay2."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Misaka16384" }]
keywords = [
    "stabilizer codes",
    "topological order",
    "homological algebra",
    "macaulay2",
    "fracton",
    "anyon mobility",
    "quantum error correction",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# The finite-lattice and boundary helpers use NumPy/SymPy; homological algebra
# is delegated to an external Macaulay2 binary via the engine.
dependencies = ["numpy", "sympy"]

[project.optional-dependencies]
# MCP transport (used by `mobility-toolkit install` to wire agents that
# prefer Model Context Protocol over native skill folders).
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=7.0"]
viz = ["matplotlib"]

[project.scripts]
mobility-toolkit = "mobility_toolkit.__main__:main"

[tool.setuptools]
packages = { find = { include = ["mobility_toolkit*"] } }

[tool.setuptools.dynamic]
version = { attr = "mobility_toolkit.__version__" }

[tool.setuptools.package-data]
# Skill bundles (SKILL.md + scripts) ship inside the wheel so a pipx/wheel
# install from the git URL can wire them into agents.
mobility_toolkit = ["skills/**/*.md", "skills/**/*.py", "skills/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
